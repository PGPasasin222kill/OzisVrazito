name: Build Meowdoku Android APK

on:
  push:
    paths:
      - "meowdoku/**"
      - ".github/workflows/build-meowdoku.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager not found"; exit 1; fi
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile debug APK
        working-directory: meowdoku
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Meowdoku-Screen-Solver-APK
          path: meowdoku/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
